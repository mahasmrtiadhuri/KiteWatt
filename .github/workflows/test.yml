name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e '.[dev]' --no-deps
          python -m pip install pytest
      - name: Unit tests
        run: python -m pytest
      - name: Text lab smoke
        run: python -m kitewatt.molt text-lab --seed 7 --output runs/ci-text
      - name: Neural compression smoke
        run: python -m kitewatt.molt demo --operator max --steps 60 --requests 24 --output runs/ci-neural
